server {
  listen 80;
  client_max_body_size 20M;
  server_tokens off;

  location /api/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:9000/api/;
  }
  location /admin/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:9000/admin/;
  }
  location /s/ {
    proxy_set_header Host $http_host;
    proxy_pass http://backend:9000;
  }
  location /media/ {
    alias /media/;
  }
  location / {
    alias /staticfiles/;
    try_files $uri /index.html;
  }
}